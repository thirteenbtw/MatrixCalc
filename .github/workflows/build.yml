name: Build binaries

# Запускается при публикации релиза или вручную (Actions -> Build binaries -> Run workflow)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, в который добавить файлы (например v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: MatrixCalculator-linux-x64
            bin: build/app/app
            flags: -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          - os: macos-latest
            asset: MatrixCalculator-macos-universal
            bin: build/app/app
            flags: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          - os: windows-latest
            asset: MatrixCalculator-windows-x64.exe
            bin: build/app/Release/app.exe
            flags: -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # в CMakeLists.txt требуется CMake 4.3+, ставим свежий
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cmake

      # для окна (GLFW) на Linux нужны заголовки X11 и OpenGL
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.flags }}

      - name: Build
        run: cmake --build build --config Release --target app

      - name: Smoke test
        run: |
          # окно на сервере без экрана не открыть, поэтому проверяем консольный режим:
          # режим 1 (матрицы), операция 6 (определитель) для матрицы 1 2 / 3 4 -> -2
          printf '1\n6\n2\n2\n1 2\n3 4\n0\n0\n' | ./${{ matrix.bin }} --console | grep -- "-2"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          cp "${{ matrix.bin }}" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber
